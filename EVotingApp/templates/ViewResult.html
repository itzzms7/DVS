{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - E-Voting System</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{% static 'default.css' %}" rel="stylesheet">

</head>

<body>

<!-- NAVBAR (ADMIN CONTEXT) -->
<div class="navbar">
    <div class="logo">Admin Panel</div>

    <div class="nav-links">
        <a href="{% url 'ViewCount' %}">View Vote Count</a>
        <a href="{% url 'index' %}">Logout</a>
    </div>
</div>

<!-- HERO -->
<section class="hero">
    <h1>Admin Dashboard</h1>
    <p>View system data and blockchain-related voting information.</p>
</section>

<!-- MAIN CONTENT -->
<div class="card">

    <!-- IMAGE -->
    <img src="{% static 'images/images.jpg' %}" class="banner" alt="Voting Banner">

    <!-- DYNAMIC DATA (UNCHANGED) -->
    <div class="dynamic-data">
        {{ data|safe }}
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 E-Voting System Using Ethereum Blockchain
</div>

</body>
</html>
