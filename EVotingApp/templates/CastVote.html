{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cast Vote - E-Voting System</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{% static 'default.css' %}" rel="stylesheet">

<script>
function validate(){
    var x=document.forms["f1"]["t2"].value;
    var y=document.forms["f1"]["t3"].value;

    if(x == null || x==""){
        window.alert("Please enter your name");
        document.f1.t2.focus();
        return false;
    }
    if(y == null || y==""){
        window.alert("Please enter your aadhar number");
        document.f1.t3.focus();
        return false;
    }
    return true;
}
</script>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">E-Voting</div>

    <div class="nav-links">
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'Admin' %}">Admin Login</a>
        <a href="{% url 'Vote' %}">Cast Your Vote</a>
    </div>
</div>

<!-- HERO -->
<section class="hero">
    <h1>Cast Your Vote</h1>
    <p>Submit your vote securely using blockchain-backed verification.</p>
</section>

<!-- MAIN CONTENT -->
<div class="card">

    <!-- Dynamic Data -->
    <div class="dynamic-data">
        {{ data }}
    </div>

    <!-- FORM -->
    <div class="form-container">

        <h3 class="form-title">Cast Your Vote</h3>

        <form name="f1" method="post" action="{% url 'CastVoteAction' %}" onsubmit="return validate()">
            {% csrf_token %}

            <!-- Dynamic Options (UNCHANGED) -->
            <div class="form-group">
                {{ data1|safe }}
            </div>

            <div class="form-group">
                <label>Voter Name</label>
                <input type="text" name="t2" class="inp" placeholder="Enter Your Name">
            </div>

            <div class="form-group">
                <label>Aadhar Number</label>
                <input type="tel" pattern="[0-9]{12}" name="t3" class="inp" placeholder="Enter 12 Digit Aadhar Number">
            </div>

            <div class="form-group">
                <button type="submit" class="btn-primary">Submit Your Vote</button>
            </div>

        </form>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 E-Voting System Using Ethereum Blockchain
</div>

</body>
</html>
