{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Vote Count - Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{% static 'default.css' %}" rel="stylesheet">

<script>
function validate(){
    var x=document.forms["f1"]["t1"].value;

    if(x == null || x==""){
        window.alert("Please enter candidate id");
        document.f1.t1.focus();
        return false;
    }
    return true;
}
</script>

</head>

<body>

<!-- NAVBAR (ADMIN CONTEXT) -->
<div class="navbar">
    <div class="logo">Admin Panel</div>

    <div class="nav-links">
        <a href="{% url 'ViewCount' %}">View Vote Count</a>
        <a href="{% url 'index' %}">Logout</a>
    </div>
</div>

<!-- HERO -->
<section class="hero">
    <h1>View Vote Count</h1>
    <p>Retrieve vote count for a specific candidate.</p>
</section>

<!-- MAIN CONTENT -->
<div class="card">

    <!-- Dynamic Data -->
    <div class="dynamic-data">
        {{ data }}
    </div>

    <!-- FORM -->
    <div class="form-container">

        <h3 class="form-title">View Vote Count Screen</h3>

        <form name="f1" method="post" action="{% url 'ViewCountAction' %}" onsubmit="return validate()">
            {% csrf_token %}

            <div class="form-group">
                <label>Candidate ID</label>
                <input type="text" name="t1" class="input">
            </div>

            <div class="form-group">
                <button type="submit" class="btn-primary">View Count</button>
            </div>

        </form>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 E-Voting System Using Ethereum Blockchain
</div>

</body>
</html>
