{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - E-Voting System</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{% static 'default.css' %}" rel="stylesheet">

<script>
function validate(){
    var x=document.forms["f1"]["username"].value;
    var y=document.forms["f1"]["password"].value;

    if(x == null || x==""){
        window.alert("Username must be enter");
        document.f1.username.focus();
        return false;
    }
    if(y == null || y==""){
        window.alert("Finger Password must be uploaded");
        document.f1.password.focus();
        return false;
    }
    return true;
}
</script>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">E-Voting</div>

    <div class="nav-links">
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'Admin' %}">Admin Login</a>
        <a href="{% url 'Vote' %}">Cast Your Vote</a>
    </div>
</div>

<!-- HERO -->
<section class="hero">
    <h1>Admin Login</h1>
    <p>Access the administrative control panel securely.</p>
</section>

<!-- MAIN CONTENT -->
<div class="card">

    <!-- Dynamic Data -->
    <div class="dynamic-data">
        {{ data }}
    </div>

    <!-- LOGIN FORM -->
    <div class="form-container">

        <h3 class="form-title">Admin Login Screen</h3>

        <form name="f1" method="post" action="{% url 'AdminLogin' %}" onsubmit="return validate()">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" style="background-color: #ffffff !important;
    color: var(--text);" class="inp" >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" style="background-color: #ffffff !important;
    color: var(--text);"  class="inp">
            </div>

            <div class="form-group">
                <button type="submit" class="btn-primary">Login</button>
            </div>

        </form>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 E-Voting System Using Ethereum Blockchain
</div>

</body>
</html>
