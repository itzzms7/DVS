{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Voting System Using Ethereum Blockchain</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="{% static 'default.css' %}" rel="stylesheet">
<style>
    td{color:black;}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">E-Voting</div>

    <div class="nav-links">
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'Admin' %}">Admin Login</a>
        <a href="{% url 'Vote' %}">Cast Your Vote</a>
    </div>
</div>

<!-- HERO -->
<section class="hero">
    <h1>E-Voting System Using Ethereum Blockchain</h1>
    <p>View system data and blockchain-backed voting records.</p>
</section>

<!-- MAIN CONTENT -->
<div class="card">

    <!-- IMAGE -->
    <img src="{% static 'images/images.jpg' %}" class="banner" alt="Voting Banner">

    <!-- DYNAMIC DATA (UNCHANGED) -->
    <div class="dynamic-data">
        {{ data|safe }}
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 E-Voting System Using Ethereum Blockchain
</div>

</body>
</html>
